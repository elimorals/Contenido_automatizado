  <rect width="1200" height="630" fill="#050608"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <line x1="60" y1="60" x2="1140" y2="60" stroke="#3A3528" stroke-width="1"/>
  <line x1="60" y1="570" x2="1140" y2="570" stroke="#3A3528" stroke-width="1"/>

